name: mascoplay
description: A full-featured music platform app with upload, download, top charts, player, and user ranking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.7.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^11.0.0
  file_picker: ^6.1.0
  path_provider: ^2.0.15
  just_audio: ^0.9.40
  flutter_downloader: ^1.12.0
  provider: ^6.1.6
  cupertino_icons: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
